<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tinta App · Gestión de Energía</title>

<style>
:root {
    --black:#05090b;
    --black-2:#091014;
    --panel:#0c1418;
    --panel-2:#101b20;
    --panel-3:#142126;
    --line:#24343a;
    --line-soft:#1a292e;
    --white:#f7faf9;
    --muted:#829095;
    --yellow:#ffd21a;
    --yellow-2:#ffb800;
    --green:#54e51c;
    --green-2:#24b90f;
    --red:#ff3b24;
    --red-2:#ff5a18;
    --blue:#3aa9ff;
    --radius:14px;
    --shadow:0 14px 40px rgba(0,0,0,.28);
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{width:100%;height:100%}

body{
    overflow:hidden;
    color:var(--white);
    font-family:Inter,"Segoe UI",Roboto,system-ui,sans-serif;
    background:
        radial-gradient(circle at 8% 5%,rgba(255,205,0,.055),transparent 24%),
        radial-gradient(circle at 92% 90%,rgba(53,229,28,.065),transparent 28%),
        var(--black);
}

button,input,select{font:inherit}

.app{
    width:100%;
    height:100vh;
    display:grid;
    grid-template-rows:58px minmax(0,1fr);
}

 /* =========================
    BARRA SUPERIOR
    ========================= */
.topbar{
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 18px;
    background:rgba(5,9,11,.94);
    border-bottom:1px solid #263238;
    box-shadow:0 6px 24px rgba(0,0,0,.25);
    backdrop-filter:blur(14px);
    z-index:20;
}

.brand{
    width:210px;
    display:flex;
    align-items:center;
    gap:9px;
    flex:0 0 auto;
}

.brand-logo{
    width:32px;height:32px;
    object-fit:contain;
    filter:drop-shadow(0 0 7px rgba(255,190,0,.2));
}

.brand-name{
    font-size:16px;
    font-weight:850;
    letter-spacing:-.5px;
}

.brand-name span{color:var(--yellow)}

.nav{
    display:flex;
    align-items:center;
    gap:4px;
    height:100%;
}

.nav button{
    height:34px;
    padding:0 12px;
    border:1px solid transparent;
    border-radius:9px;
    color:#87959a;
    background:transparent;
    cursor:pointer;
    font-size:11px;
    font-weight:750;
    transition:.2s;
}

.nav button:hover{color:#fff;background:#10191d}

.nav button.active{
    color:var(--yellow);
    background:rgba(255,210,26,.075);
    border-color:rgba(255,210,26,.22);
}

.top-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:7px;
}

.icon-btn{
    width:33px;height:33px;
    display:grid;place-items:center;
    border:1px solid #25343a;
    border-radius:9px;
    color:#aab5b8;
    background:#0d1519;
    cursor:pointer;
}

.icon-btn:hover{border-color:#46575d;color:#fff}

.avatar{
    width:33px;height:33px;
    display:grid;place-items:center;
    border-radius:50%;
    color:#071006;
    background:linear-gradient(135deg,var(--yellow),var(--green));
    font-size:11px;
    font-weight:900;
}

 /* =========================
    CUERPO
    ========================= */
.content{
    min-height:0;
    display:grid;
    grid-template-columns:235px minmax(0,1fr);
    gap:12px;
    padding:12px;
}

.sidebar{
    min-height:0;
    display:flex;
    flex-direction:column;
    padding:11px;
    border:1px solid #27373d;
    border-radius:var(--radius);
    background:linear-gradient(180deg,#0d171b,#0a1215);
    box-shadow:var(--shadow);
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:3px 5px 9px;
    color:#77868b;
    font-size:9px;
    font-weight:850;
    text-transform:uppercase;
    letter-spacing:1.1px;
}

.form-panel{
    min-height:0;
    padding:0;
    background:transparent;
    border:0;
    box-shadow:none;
}

.panel-heading{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 10px;
}

.panel-heading-icon{
    width:29px;height:29px;
    display:grid;place-items:center;
    border:1px solid rgba(255,210,26,.35);
    border-radius:8px;
    color:var(--yellow);
    background:rgba(255,210,26,.06);
    font-size:14px;
}

.form-panel h2{font-size:12px;font-weight:800}
.form-panel .subtitle{font-size:9px;color:var(--muted);margin-top:2px}

.form-group{margin-bottom:8px}

.form-group label{
    display:block;
    margin:0 0 4px 1px;
    color:#87969b;
    font-size:9px;
    font-weight:750;
}

.form-control{
    width:100%;
    height:31px;
    padding:0 8px;
    color:#eaf0ef;
    border:1px solid #26363b;
    border-radius:8px;
    outline:none;
    background:#0d171b;
    font-size:10px;
    transition:.18s;
}

.form-control::placeholder{color:#536267}
.form-control:hover{border-color:#3a4d53}
.form-control:focus{
    border-color:rgba(255,210,26,.65);
    box-shadow:0 0 0 2px rgba(255,210,26,.07);
}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.btn-submit{
    width:100%;
    height:32px;
    margin-top:2px;
    border:1px solid rgba(255,210,26,.35);
    border-radius:8px;
    color:#090b09;
    background:linear-gradient(135deg,#ffe44e,#ffb900);
    box-shadow:0 6px 18px rgba(255,190,0,.12);
    cursor:pointer;
    font-size:10px;
    font-weight:900;
    transition:.2s;
}

.btn-submit:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(255,190,0,.18)}

.side-divider{
    height:1px;
    margin:13px 3px 11px;
    background:#1d2b30;
}

.side-mini-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.mini-stat{
    padding:8px;
    border:1px solid #26363b;
    border-radius:9px;
    background:#0d171b;
}

.mini-stat small{display:block;color:#68777c;font-size:8px}
.mini-stat strong{display:block;margin-top:2px;font-size:13px}
.mini-stat strong.yellow{color:var(--yellow)}
.mini-stat strong.green{color:var(--green)}

 /* =========================
    WORKSPACE
    ========================= */
.workspace{
    min-width:0;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) 43px;
    gap:10px;
}

.drop-zone-container{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    border:1px solid #304148;
    border-radius:var(--radius);
    background:linear-gradient(180deg,rgba(16,27,32,.98),rgba(9,16,19,.98));
    box-shadow:var(--shadow);
    overflow:hidden;
}

.drop-zone-container:nth-child(2){
    border-color:#39533d;
    box-shadow:0 14px 40px rgba(20,70,28,.10);
}

.drop-zone-title{
    min-height:49px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 10px;
    border-bottom:1px solid #26373d;
    background:rgba(255,255,255,.018);
}

.zone-icon{
    width:28px;height:28px;
    display:grid;place-items:center;
    border:1px solid #31434a;
    border-radius:8px;
    color:var(--yellow);
    background:#101b20;
    font-size:13px;
}

.drop-zone-container:nth-child(2) .zone-icon{
    color:var(--green);
    border-color:#35533c;
    background:#0d1b13;
}

.zone-title-text{display:flex;flex-direction:column;line-height:1.05}
.zone-title-text strong{font-size:11px;font-weight:850}
.zone-title-text small{margin-top:3px;color:#68787d;font-size:8px}

.zone-count{
    min-width:23px;height:20px;
    margin-left:2px;
    padding:0 6px;
    display:grid;place-items:center;
    border:1px solid #33454c;
    border-radius:20px;
    color:#b9c4c7;
    background:#101b20;
    font-size:9px;
    font-weight:850;
}

.inventory-tools{
    display:flex;
    align-items:center;
    gap:5px;
    margin-left:auto;
}

.search-wrap{position:relative;width:175px}

.search-wrap span{
    position:absolute;
    left:8px;top:50%;
    transform:translateY(-50%);
    color:#617177;
    font-size:10px;
    pointer-events:none;
}

.search-input{
    width:100%;height:27px;
    padding:0 8px 0 25px;
    border:1px solid #2b3d43;
    border-radius:8px;
    outline:none;
    color:#e9eeee;
    background:#0a1215;
    font-size:9px;
}

.search-input:focus{border-color:#65767b}

.filter-btn{
    height:27px;
    padding:0 8px;
    border:1px solid #2b3d43;
    border-radius:8px;
    color:#91a0a4;
    background:#0a1215;
    cursor:pointer;
    font-size:9px;
}

.drop-zone{
    position:relative;
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:8px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(137px,1fr));
    grid-auto-rows:max-content;
    align-content:start;
    gap:6px;
    scrollbar-width:thin;
    scrollbar-color:#304147 transparent;
}

#zoneA{background:rgba(5,11,14,.22)}
#zoneB{background:rgba(5,18,10,.18)}

.drop-zone.drag-over{
    background:rgba(255,210,26,.045);
    box-shadow:inset 0 0 0 1px rgba(255,210,26,.28);
}

#zoneB.drag-over{
    background:rgba(84,229,28,.045);
    box-shadow:inset 0 0 0 1px rgba(84,229,28,.28);
}

 /* =========================
    TARJETAS ULTRA COMPACTAS
    ========================= */
.card{
    min-width:0;
    position:relative;
    padding:7px;
    border:1px solid #26383e;
    border-left:2px solid var(--yellow);
    border-radius:9px;
    background:linear-gradient(145deg,#111d21,#0c1518);
    box-shadow:0 4px 12px rgba(0,0,0,.16);
    cursor:grab;
    user-select:none;
    transition:.16s;
}

.card:hover{
    transform:translateY(-1px);
    border-color:#465960;
    box-shadow:0 8px 18px rgba(0,0,0,.25);
}

.card:active{cursor:grabbing}
.card.dragging{opacity:.38;transform:scale(.97)}

#zoneB .card{
    border-left-color:var(--green);
    border-color:#294235;
    background:linear-gradient(145deg,#101d16,#0b1510);
}

.card-header{
    min-width:0;
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    padding-bottom:5px;
    border-bottom:1px solid #1e2d32;
}

.card-icon{
    width:25px;height:25px;
    flex:0 0 25px;
    display:grid;place-items:center;
    border:1px solid #33464d;
    border-radius:7px;
    color:var(--yellow);
    background:#111d21;
    font-size:12px;
}

#zoneB .card-icon{
    color:var(--green);
    border-color:#31513a;
    background:#0d1b13;
}

.card-heading{min-width:0;flex:1}
.card-title{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:9px;
    font-weight:850;
}

.card-category{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-top:1px;
    color:#68787d;
    font-size:7px;
}

.card-body{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:3px;
}

.data-point{
    min-width:0;
    padding:3px 2px;
    border:1px solid #1d2b30;
    border-radius:5px;
    background:#0b1417;
    text-align:center;
}

#zoneB .data-point{
    border-color:#20352a;
    background:#0a1510;
}

.data-label{
    display:block;
    color:#637278;
    font-size:6px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.25px;
}

.data-value{
    display:block;
    margin-top:1px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#dce5e4;
    font-size:8px;
    font-weight:850;
}

 /* =========================
    ESTADO VACÍO
    ========================= */
.drop-zone:empty::before{
    content:"Arrastra aquí tus dispositivos";
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    color:#46565b;
    font-size:9px;
    font-weight:650;
    pointer-events:none;
}

#zoneB:empty::after{
    content:"Selecciona los aparatos que pertenecen a tu hogar";
    position:absolute;
    left:50%;
    top:53%;
    transform:translate(-50%,0);
    width:80%;
    text-align:center;
    color:#304039;
    font-size:8px;
    pointer-events:none;
}

 /* =========================
    CALCULAR
    ========================= */
.workspace > button{
    grid-column:1/-1;
    height:43px;
    border:1px solid rgba(255,210,26,.38);
    border-radius:11px;
    color:#090b09;
    background:linear-gradient(135deg,#ffe34c,#ffb900);
    box-shadow:0 8px 22px rgba(255,190,0,.11);
    cursor:pointer;
    font-size:11px;
    font-weight:900;
    transition:.2s;
}

.workspace > button:hover{transform:translateY(-1px);box-shadow:0 11px 25px rgba(255,190,0,.18)}

 /* =========================
    RESPONSIVE
    ========================= */
@media(max-width:950px){
    body{overflow:auto}
    .app{height:auto;min-height:100vh}
    .content{grid-template-columns:1fr}
    .sidebar{min-height:auto}
    .workspace{min-height:620px}
}

@media(max-width:650px){
    .topbar{padding:0 9px;gap:8px}
    .brand{width:auto}
    .brand-name{display:none}
    .nav button{padding:0 7px;font-size:9px}
    .top-actions .icon-btn{display:none}
    .content{padding:8px}
    .workspace{grid-template-columns:1fr 1fr}
    .search-wrap{width:110px}
    .drop-zone{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
</style>
</head>

            <button class="icon-btn" type="button" title="Configuración">⚙</button>
            <div class="avatar">TA</div>
        </div>
    </header>

    <section class="content">

        <aside class="sidebar">

            <div class="section-title">
                <span>Configuración rápida</span>
            </div>

            <div class="form-panel">
                <div class="panel-heading">
                    <div class="panel-heading-icon">＋</div>
                    <div>
                        <h2>Nuevo dispositivo</h2>
                        <div class="subtitle">Añade un electrodoméstico</div>
                    </div>
                </div>

                <form id="applianceForm">

                    <div class="form-group">
                        <label for="appName">Dispositivo</label>
                        <input type="text" id="appName" class="form-control"
                               placeholder="Ej. Refrigerador LG" required>
                    </div>

                    <div class="form-group">
                        <label for="appCategory">Categoría</label>
                        <select id="appCategory" class="form-control" required>
                            <option value="" disabled selected>Selecciona categoría</option>
                            <option value="Línea Blanca">Línea Blanca</option>
                            <option value="Climatización">Climatización</option>
                            <option value="Entretenimiento">Entretenimiento</option>
                            <option value="Iluminación">Iluminación</option>
                            <option value="Informática">Informática</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="appPower">Potencia · Watts</label>
                        <input type="number" id="appPower" class="form-control"
                               placeholder="Ej. 150" min="1" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="appMinHours">Mín. h/día</label>
                            <input type="number" id="appMinHours" class="form-control"
                                   placeholder="0" min="0" max="24" required>
                        </div>
                        <div class="form-group">
                            <label for="appMaxHours">Máx. h/día</label>
                            <input type="number" id="appMaxHours" class="form-control"
                                   placeholder="24" min="0" max="24" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">＋ Guardar dispositivo</button>
                </form>
            </div>

            <div class="side-divider"></div>

            <div class="section-title">
                <span>Resumen rápido</span>
            </div>

            <div class="side-mini-stats">
                <div class="mini-stat">
                    <small>Dispositivos</small>
                    <strong id="totalCount">0</strong>
                </div>
                <div class="mini-stat">
                    <small>En hogar</small>
                    <strong class="green" id="homeCountSide">0</strong>
                </div>
                <div class="mini-stat">
                    <small>Potencia</small>
                    <strong class="yellow" id="powerCount">0 W</strong>
                </div>
                <div class="mini-stat">
                    <small>Estado</small>
                    <strong class="green">Activo</strong>
                </div>
            </div>

        </aside>

        <main class="workspace">

            <div class="drop-zone-container">

                <div class="drop-zone-title">
                    <span class="zone-icon">▦</span>

                    <span class="zone-title-text">
                        <strong>Inventario</strong>
                        <small>Dispositivos disponibles</small>
                    </span>

                    <span class="zone-count" id="inventoryCount">0</span>

                    <div class="inventory-tools">
                        <div class="search-wrap">
                            <span>⌕</span>
                            <input id="inventorySearch" class="search-input"
                                   type="search"
                                   placeholder="Buscar dispositivo...">
                        </div>
                        <button class="filter-btn" type="button" title="Filtros">☷</button>
                    </div>
                </div>

                <div id="zoneA" class="drop-zone">
                    <!-- Las tarjetas generadas aparecerán aquí -->
                </div>

            </div>

            <div class="drop-zone-container">

                <div class="drop-zone-title">
                    <span class="zone-icon">⌂</span>

                    <span class="zone-title-text">
                        <strong>Mi Hogar</strong>
                        <small>Aparatos seleccionados</small>
                    </span>

                    <span class="zone-count" id="homeCount">0</span>
                </div>

                <div id="zoneB" class="drop-zone">
                </div>

            </div>

            <button onclick="calcular()">⚡ Calcular consumo</button>

        </main>
    </section>
</div>

<script>
const form = document.getElementById("applianceForm");
const zoneA = document.getElementById("zoneA");
const zoneB = document.getElementById("zoneB");
const inventorySearch = document.getElementById("inventorySearch");

const icons = {
    "Línea Blanca": "▣",
    "Climatización": "❄",
    "Entretenimiento": "▶",
    "Iluminación": "◉",
    "Informática": "⌨",
    "default": "⚡"
};

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("appName").value.trim();
    const category = document.getElementById("appCategory").value;
    const power = document.getElementById("appPower").value;
    const minHours = document.getElementById("appMinHours").value;
    const maxHours = document.getElementById("appMaxHours").value;

    if (!name || !category || !power || minHours === "" || maxHours === "") return;

    if (Number(minHours) > Number(maxHours)) {
        alert("Las horas mínimas no pueden superar las horas máximas.");
        return;
    }

    const card = document.createElement("article");
    card.className = "card";
    card.draggable = true;
    card.dataset.name = name.toLowerCase();
    card.dataset.category = category.toLowerCase();
    card.dataset.power = power;

    card.innerHTML = `
        <div class="card-header">
            <div class="card-icon">${icons[category] || icons.default}</div>
            <div class="card-heading">
                <div class="card-title" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
                <span class="card-category">${escapeHtml(category)}</span>
            </div>
        </div>

        <div class="card-body">
            <div class="data-point">
                <span class="data-label">Pot.</span>
                <span class="data-value">${power} W</span>
            </div>
            <div class="data-point">
                <span class="data-label">Mín.</span>
                <span class="data-value">${minHours} h</span>
            </div>
            <div class="data-point">
                <span class="data-label">Máx.</span>
                <span class="data-value">${maxHours} h</span>
            </div>
        </div>
    `;

    enableDrag(card);
    zoneA.appendChild(card);

    form.reset();
    updateCounters();
    applySearch();
});

function enableDrag(card) {
    card.addEventListener("dragstart", function() {
        card.classList.add("dragging");
    });

    card.addEventListener("dragend", function() {
        card.classList.remove("dragging");
        zoneA.classList.remove("drag-over");
        zoneB.classList.remove("drag-over");
        updateCounters();
    });
}

[zoneA, zoneB].forEach(zone => {
    zone.addEventListener("dragover", function(event) {
        event.preventDefault();
        zone.classList.add("drag-over");

        const dragging = document.querySelector(".dragging");
        if (dragging) {
            zone.appendChild(dragging);
        }
    });

    zone.addEventListener("drop", function() {
        zone.classList.remove("drag-over");
        updateCounters();
    });

    zone.addEventListener("dragleave", function(event) {
        if (!zone.contains(event.relatedTarget)) {
            zone.classList.remove("drag-over");
        }
    });
});

inventorySearch.addEventListener("input", applySearch);

function applySearch() {
    const query = inventorySearch.value.trim().toLowerCase();

    zoneA.querySelectorAll(".card").forEach(card => {
        const matches =
            !query ||
            card.dataset.name.includes(query) ||
            card.dataset.category.includes(query) ||
            card.dataset.power.includes(query);

        card.style.display = matches ? "" : "none";
    });
}

function updateCounters() {
    const inventory = zoneA.querySelectorAll(".card").length;
    const home = zoneB.querySelectorAll(".card").length;

    document.getElementById("inventoryCount").textContent = inventory;
    document.getElementById("homeCount").textContent = home;
    document.getElementById("homeCountSide").textContent = home;
    document.getElementById("totalCount").textContent = inventory + home;

    let watts = 0;
    document.querySelectorAll(".card").forEach(card => {
        watts += Number(card.dataset.power || 0);
    });

    document.getElementById("powerCount").textContent =
        watts.toLocaleString("es-BO") + " W";
}

function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
}

function calcular() {
    const cards = zoneB.querySelectorAll(".card");

    if (!cards.length) {
        alert("Agrega al menos un dispositivo a Mi Hogar.");
        return;
    }

    let totalMin = 0;
    let totalMax = 0;

    cards.forEach(card => {
        const values = card.querySelectorAll(".data-value");
        const power = parseFloat(values[0].textContent) || 0;
        const min = parseFloat(values[1].textContent) || 0;
        const max = parseFloat(values[2].textContent) || 0;

        totalMin += (power * min) / 1000;
        totalMax += (power * max) / 1000;
    });

    alert(
        "Consumo estimado diario\n\n" +
        "Mínimo: " + totalMin.toFixed(2) + " kWh/día\n" +
        "Máximo: " + totalMax.toFixed(2) + " kWh/día"
    );
}

updateCounters();
</script>
</body>
</html>
