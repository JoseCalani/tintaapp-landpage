<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>Gestor de Consumo Eléctrico</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #f59e0b;
            --success: #16a34a;
            --bg: #f3f6fa;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --zone-a: #f8fafc;
            --zone-b: #f0fdf4;
            --zone-b-border: #86efac;
            --shadow: 0 8px 30px rgba(15, 23, 42, .07);
            --shadow-hover: 0 12px 30px rgba(15, 23, 42, .13);
            --radius: 16px;
            --radius-sm: 11px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 8% 0%, rgba(37, 99, 235, .07), transparent 28%),
                radial-gradient(circle at 92% 100%, rgba(22, 163, 74, .06), transparent 30%),
                var(--bg);
            overflow: hidden;
        }

        button, input, select {
            font: inherit;
        }

        /* =========================
           CONTENEDOR PRINCIPAL
           ========================= */

        .container {
            width: min(1480px, calc(100% - 28px));
            height: calc(100vh - 28px);
            min-height: 600px;
            margin: 14px auto;
            display: grid;
            grid-template-columns: 285px minmax(0, 1fr);
            grid-template-rows: auto minmax(0, 1fr);
            gap: 14px;
        }

        /* =========================
           HEADER COMPACTO
           ========================= */

        header {
            grid-column: 1 / -1;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(255,255,255,.92);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            color: #fff;
            background: linear-gradient(145deg, #2563eb, #1e40af);
            box-shadow: 0 7px 18px rgba(37,99,235,.25);
            font-size: 20px;
        }

        header h1 {
            font-size: 18px;
            line-height: 1.15;
            letter-spacing: -.3px;
        }

        header p {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 0 4px rgba(34,197,94,.12);
        }

        /* =========================
           PANEL DEL FORMULARIO
           ========================= */

        .form-panel {
            min-height: 0;
            overflow: hidden;
            padding: 17px;
            background: rgba(255,255,255,.94);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .panel-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 13px;
            border-bottom: 1px solid var(--border);
        }

        .panel-heading-icon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: #eff6ff;
            color: var(--primary);
            font-size: 17px;
        }

        .form-panel h2 {
            font-size: 14px;
            font-weight: 750;
        }

        .form-panel .subtitle {
            margin-top: 2px;
            color: var(--muted);
            font-size: 10px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #334155;
            font-size: 11px;
            font-weight: 700;
        }

        .form-control {
            width: 100%;
            height: 36px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            color: var(--text);
            background: var(--surface-soft);
            font-size: 12px;
            transition: .2s ease;
        }

        .form-control:hover {
            border-color: var(--border-strong);
        }

        .form-control:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,.10);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .form-row .form-group {
            min-width: 0;
        }

        .btn-submit {
            width: 100%;
            height: 38px;
            margin-top: 4px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            font-size: 12px;
            font-weight: 750;
            cursor: pointer;
            box-shadow: 0 7px 15px rgba(37,99,235,.20);
            transition: .2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(37,99,235,.25);
        }

        /* =========================
           ÁREA DE TRABAJO
           ========================= */

        .workspace {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) 40px;
            gap: 12px;
        }

        .drop-zone-container {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .drop-zone-title {
            height: 34px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
            color: #334155;
            font-size: 12px;
            font-weight: 750;
        }

        .zone-icon {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 9px;
            background: #e0edff;
            color: var(--primary);
            font-size: 14px;
        }

        .zone-title-text {
            display: flex;
            flex-direction: column;
            line-height: 1.05;
        }

        .zone-title-text small {
            margin-top: 3px;
            color: var(--muted);
            font-size: 9px;
            font-weight: 500;
        }

        .zone-count {
            margin-left: auto;
            min-width: 24px;
            height: 22px;
            padding: 0 7px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            background: #e2e8f0;
            color: #475569;
            font-size: 10px;
            font-weight: 800;
        }

        .drop-zone {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            grid-auto-rows: max-content;
            align-content: start;
            gap: 9px;
            border: 1px dashed var(--border-strong);
            border-radius: var(--radius);
            background: rgba(248,250,252,.72);
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
            transition: .2s ease;
        }

        #zoneB {
            border-color: var(--zone-b-border);
            background: rgba(240,253,244,.72);
        }

        .drop-zone.drag-over {
            border-color: var(--primary);
            background: #eff6ff;
            box-shadow: inset 0 0 0 2px rgba(37,99,235,.08);
        }

        #zoneB.drag-over {
            border-color: #22c55e;
            background: #ecfdf5;
        }

        /* =========================
           TARJETAS DE ELECTRODOMÉSTICOS
           ========================= */

        .card {
            min-width: 0;
            position: relative;
            padding: 11px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--primary);
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 3px 12px rgba(15,23,42,.055);
            cursor: grab;
            user-select: none;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #bfdbfe;
            box-shadow: var(--shadow-hover);
        }

        .card:active {
            cursor: grabbing;
        }

        .card.dragging {
            opacity: .45;
            transform: scale(.97) rotate(1deg);
        }

        #zoneB .card {
            border-left-color: var(--success);
            background: #fff;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 9px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eef2f7;
        }

        .card-icon {
            width: 32px;
            height: 32px;
            flex: 0 0 32px;
            display: grid;
            place-items: center;
            border-radius: 9px;
            background: #eff6ff;
            color: var(--primary);
            font-size: 17px;
        }

        #zoneB .card-icon {
            background: #ecfdf5;
            color: var(--success);
        }

        .card-heading {
            min-width: 0;
            flex: 1;
        }

        .card-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
            font-weight: 800;
        }

        .card-category {
            display: inline-block;
            max-width: 100%;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
            font-size: 9px;
            font-weight: 600;
        }

        .card-body {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .data-point {
            min-width: 0;
            padding: 5px 3px;
            text-align: center;
            border-radius: 7px;
            background: #f8fafc;
        }

        #zoneB .data-point {
            background: #f0fdf4;
        }

        .data-label {
            display: block;
            color: var(--muted);
            font-size: 7px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .3px;
        }

        .data-value {
            display: block;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 10px;
            font-weight: 800;
        }

        /* Estado vacío generado visualmente sin modificar IDs */
        .drop-zone:empty::before {
            content: "Arrastra aquí tus aparatos";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            pointer-events: none;
        }

        /* =========================
           BOTÓN CALCULAR
           ========================= */

        .workspace > button {
            grid-column: 1 / -1;
            width: 100%;
            height: 40px;
            border: 0;
            border-radius: 11px;
            color: #fff;
            background: linear-gradient(135deg, #0f172a, #334155);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 7px 16px rgba(15,23,42,.16);
            transition: .2s ease;
        }

        .workspace > button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(15,23,42,.22);
        }

        /* =========================
           SCROLLBAR
           ========================= */

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            border-radius: 20px;
            background: #cbd5e1;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .container {
                height: auto;
                min-height: calc(100vh - 20px);
                margin: 10px auto;
                grid-template-columns: 1fr;
                grid-template-rows: auto auto minmax(520px, 1fr);
            }

            header {
                height: auto;
                min-height: 64px;
            }

            .form-panel {
                overflow: visible;
            }

            .workspace {
                min-height: 520px;
            }
        }

        @media (max-width: 620px) {
            .container {
                width: calc(100% - 16px);
                margin: 8px auto;
            }

            header {
                padding: 12px 14px;
            }

            .header-status {
                display: none;
            }

            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(260px, 1fr) minmax(260px, 1fr) 40px;
            }

            .drop-zone {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <div class="brand">
                <div class="brand-icon">⚡</div>
                <div>
                    <h1>Gestor de Consumo Eléctrico</h1>
                    <p>Organiza tus electrodomésticos y analiza su consumo.</p>
                </div>
            </div>

            <div class="header-status">
                <span class="status-dot"></span>
                Sistema listo
            </div>
        </header>

        <aside class="form-panel">
            <div class="panel-heading">
                <div class="panel-heading-icon">＋</div>
                <div>
                    <h2>Nuevo dispositivo</h2>
                    <div class="subtitle">Añade un aparato al inventario</div>
                </div>
            </div>

            <form id="applianceForm">

                <div class="form-group">
                    <label for="appName">Dispositivo</label>
                    <input
                        type="text"
                        id="appName"
                        class="form-control"
                        placeholder="Ej. Refrigerador LG"
                        required>
                </div>

                <div class="form-group">
                    <label for="appCategory">Categoría</label>
                    <select id="appCategory" class="form-control" required>
                        <option value="" disabled selected>Selecciona una categoría</option>
                        <option value="Línea Blanca">Línea Blanca</option>
                        <option value="Climatización">Climatización</option>
                        <option value="Entretenimiento">Entretenimiento</option>
                        <option value="Iluminación">Iluminación</option>
                        <option value="Informática">Informática</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="appPower">Potencia (Watts)</label>
                    <input
                        type="number"
                        id="appPower"
                        class="form-control"
                        placeholder="Ej. 150"
                        min="1"
                        required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="appMinHours">Mín. horas/día</label>
                        <input
                            type="number"
                            id="appMinHours"
                            class="form-control"
                            placeholder="0"
                            min="0"
                            max="24"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="appMaxHours">Máx. horas/día</label>
                        <input
                            type="number"
                            id="appMaxHours"
                            class="form-control"
                            placeholder="24"
                            min="0"
                            max="24"
                            required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Guardar dispositivo</button>
            </form>
        </aside>

        <main class="workspace">

            <div class="drop-zone-container">
                <div class="drop-zone-title">
                    <span class="zone-icon">▦</span>
                    <span class="zone-title-text">
                        Inventario
                        <small>Dispositivos disponibles</small>
                    </span>
                    <span class="zone-count" id="inventoryCount">0</span>
                </div>

                <div id="zoneA" class="drop-zone">
                    <!-- Las tarjetas generadas aparecerán aquí -->
                </div>
            </div>

            <div class="drop-zone-container">
                <div class="drop-zone-title">
                    <span class="zone-icon">⌂</span>
                    <span class="zone-title-text">
                        Mi Hogar
                        <small>Aparatos seleccionados</small>
                    </span>
                    <span class="zone-count" id="homeCount">0</span>
                </div>

                <div id="zoneB" class="drop-zone">
                </div>
            </div>

            <button onclick="calcular()">Calcular consumo</button>

        </main>
    </div>

    <script>

    </script>

</body>
</html>
